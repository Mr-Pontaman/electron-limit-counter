name: Release App

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "electron/**"
      - "package.json"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm run build

      - name: Package Windows
        if: runner.os == 'Windows'
        run: pnpm exec electron-builder --win --config electron-builder.config.ts --publish never

      - name: Package Linux
        if: runner.os == 'Linux'
        run: pnpm exec electron-builder --linux --config electron-builder.config.ts --publish never

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          merge-multiple: true

      - name: Delete old continuous release
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: |
          gh release delete continuous --yes 2>/dev/null || true
          git push --delete origin continuous 2>/dev/null || true

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(all-artifacts/*)

          gh release create "continuous" \
            --title "App Latest (Continuous)" \
            --notes "" \
            "${files[@]}" \
            --target "${{ github.sha }}"
